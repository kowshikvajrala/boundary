name: Release

# Push a tag like v1.0.0 to build, sign and publish a GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing config
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add SIGNING_KEY, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEST="boundary-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | tr -dc '0-9')"
          echo "notes=fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" >> "$GITHUB_OUTPUT"

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: boundary-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Boundary ${{ steps.apk.outputs.version }}
          body_path: ${{ steps.apk.outputs.notes }}
          files: ${{ steps.apk.outputs.path }}
